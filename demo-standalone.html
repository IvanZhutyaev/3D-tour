<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tour - Standalone Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        p {
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .note {
            background: rgba(255, 200, 0, 0.2);
            border-left: 3px solid #ffc800;
            padding: 10px;
            margin-top: 15px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="info">
        <h1>3D Tour Demo</h1>
        <p>This is a standalone demo that works without a build system.</p>
        <p><strong>Controls:</strong></p>
        <ul>
            <li>Mouse drag to look around</li>
            <li>Mouse wheel to zoom</li>
        </ul>
        <div class="note">
            <strong>Note:</strong> For the full version with hotspots and navigation, use:<br>
            <code>npm install && npm run dev</code>
        </div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading Three.js...</p>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        
        // Hide loading when Three.js is loaded
        document.getElementById('loading').style.display = 'none';
        
        // Scene
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 0, 0);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('canvas'),
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Create a gradient sphere as placeholder
        const createGradientTexture = () => {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size * 2;
            canvas.height = size;
            
            const context = canvas.getContext('2d');
            
            // Create gradient
            const gradient = context.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#1e3a8a');
            gradient.addColorStop(0.5, '#3b82f6');
            gradient.addColorStop(1, '#1e3a8a');
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, size * 2, size);
            
            // Add grid
            context.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            context.lineWidth = 2;
            
            for (let i = 0; i <= 8; i++) {
                // Vertical lines
                context.beginPath();
                context.moveTo((size * 2 / 8) * i, 0);
                context.lineTo((size * 2 / 8) * i, size);
                context.stroke();
                
                // Horizontal lines
                context.beginPath();
                context.moveTo(0, (size / 4) * i);
                context.lineTo(size * 2, (size / 4) * i);
                context.stroke();
            }
            
            // Add text
            context.fillStyle = 'rgba(255, 255, 255, 0.5)';
            context.font = 'bold 48px Arial';
            context.textAlign = 'center';
            context.fillText('DEMO PANORAMA', size, size / 2);
            context.font = '24px Arial';
            context.fillText('Replace with your own 360° image', size, size / 2 + 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        };
        
        // Create sphere
        const geometry = new THREE.SphereGeometry(500, 60, 40);
        geometry.scale(-1, 1, 1);
        
        const material = new THREE.MeshBasicMaterial({
            map: createGradientTexture()
        });
        
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        // Controls
        let isUserInteracting = false;
        let onPointerDownMouseX = 0;
        let onPointerDownMouseY = 0;
        let lon = 0;
        let onPointerDownLon = 0;
        let lat = 0;
        let onPointerDownLat = 0;
        let fov = 75;
        
        // Mouse events
        const canvas = document.getElementById('canvas');
        
        canvas.addEventListener('mousedown', (event) => {
            isUserInteracting = true;
            onPointerDownMouseX = event.clientX;
            onPointerDownMouseY = event.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        });
        
        canvas.addEventListener('mousemove', (event) => {
            if (isUserInteracting) {
                lon = (onPointerDownMouseX - event.clientX) * 0.1 + onPointerDownLon;
                lat = (event.clientY - onPointerDownMouseY) * 0.1 + onPointerDownLat;
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isUserInteracting = false;
        });
        
        canvas.addEventListener('wheel', (event) => {
            event.preventDefault();
            fov = Math.max(40, Math.min(100, fov + event.deltaY * 0.05));
            camera.fov = fov;
            camera.updateProjectionMatrix();
        });
        
        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        
        function update() {
            lat = Math.max(-85, Math.min(85, lat));
            
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            
            const target = new THREE.Vector3();
            target.x = 500 * Math.sin(phi) * Math.cos(theta);
            target.y = 500 * Math.cos(phi);
            target.z = 500 * Math.sin(phi) * Math.sin(theta);
            
            camera.lookAt(target);
        }
        
        animate();
    </script>
</body>
</html>
